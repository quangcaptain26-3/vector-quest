<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Kiến trúc phân lớp 4 tầng 100% Frontend của Vector Quest">
  <defs>
    <marker id="flow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="flow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FFC640" />
    </marker>
    <marker id="flow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#56E5A9" />
    </marker>
  </defs>

  <rect width="1000" height="340" rx="16" fill="#090D16" />
  <rect x="1" y="1" width="998" height="338" rx="15" fill="none" stroke="#38BDF8" stroke-opacity="0.2" />

  <!-- Header -->
  <text x="28" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">KIẾN TRÚC PHÂN LỚP 4 TẦNG — 100% FRONTEND-ONLY</text>
  <rect x="734" y="14" width="242" height="26" rx="13" fill="#181B25" stroke="#56E5A9" stroke-opacity="0.55" />
  <circle cx="750" cy="27" r="4" fill="#56E5A9" />
  <text x="762" y="31" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#56E5A9">ZERO BACKEND • STATIC + CLIENT</text>

  <!-- Tier 1: UI & App Router -->
  <g transform="translate(26, 62)">
    <rect width="212" height="218" rx="14" fill="#0F131C" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="14" y="14" width="184" height="24" rx="6" fill="#38BDF8" fill-opacity="0.16" />
    <text x="106" y="30" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#38BDF8">1. UI &amp; APP ROUTER</text>

    <text x="16" y="60" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F8FAFC">src/app/</text>
    <text x="16" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">layout.tsx, page.tsx, error.tsx</text>

    <text x="16" y="106" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F8FAFC">src/components/</text>
    <text x="16" y="125" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• hud/ (Top, Wind, Dock)</text>
    <text x="16" y="144" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• canvas/ (Radar SVG 60 FPS)</text>
    <text x="16" y="163" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• panels/ (6 Bước sư phạm)</text>
    <text x="16" y="182" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• modals/ &amp; ui/ (KaTeX)</text>

    <text x="16" y="206" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#38BDF8">Không import chéo giữa module</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="238" y1="171" x2="268" y2="171" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#flow-cyan)" />

  <!-- Tier 2: Zustand Store -->
  <g transform="translate(272, 62)">
    <rect width="212" height="218" rx="14" fill="#0F131C" stroke="#FFC640" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="14" y="14" width="184" height="24" rx="6" fill="#FFC640" fill-opacity="0.16" />
    <text x="106" y="30" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#FFC640">2. STATE STORE (SSOT)</text>

    <text x="16" y="60" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F8FAFC">src/store/</text>
    <text x="16" y="78" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">useSimulationStore.ts</text>

    <text x="16" y="108" font-family="'Segoe UI', sans-serif" font-size="12" fill="#CBD5E1">• Zustand v5 Single Source</text>
    <text x="16" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#CBD5E1">• Điều phối 6 bước &amp; Modal</text>
    <text x="16" y="148" font-family="'Segoe UI', sans-serif" font-size="12" fill="#CBD5E1">• Công tắc độc lập (Vectơ,</text>
    <text x="24" y="165" font-family="'Segoe UI', sans-serif" font-size="12" fill="#CBD5E1">Hướng dẫn, Hình bình hành)</text>

    <text x="16" y="206" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#FFC640">Gọi Domain thuần + Audio SFX</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="484" y1="171" x2="514" y2="171" stroke="#FFC640" stroke-width="2.2" marker-end="url(#flow-amber)" />

  <!-- Tier 3: Pure Domain -->
  <g transform="translate(518, 62)">
    <rect width="212" height="218" rx="14" fill="#0F131C" stroke="#56E5A9" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="14" y="14" width="184" height="24" rx="6" fill="#56E5A9" fill-opacity="0.16" />
    <text x="106" y="30" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#56E5A9">3. PURE DOMAIN + TESTS</text>

    <text x="16" y="60" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F8FAFC">src/domain/</text>
    <text x="16" y="80" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• vectorMath.ts</text>
    <text x="16" y="99" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• landingEvaluator.ts</text>
    <text x="16" y="118" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• missionContent.ts</text>
    <text x="16" y="137" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• types.ts</text>

    <rect x="14" y="152" width="184" height="32" rx="8" fill="#56E5A9" fill-opacity="0.12" stroke="#56E5A9" stroke-opacity="0.45" />
    <text x="106" y="172" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#56E5A9">Vitest: 26/26 PASS</text>

    <text x="16" y="206" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#56E5A9">0 import React / Zustand / DOM</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="730" y1="171" x2="760" y2="171" stroke="#56E5A9" stroke-width="2.2" marker-end="url(#flow-green)" />

  <!-- Tier 4: Browser Adapters & Config -->
  <g transform="translate(764, 62)">
    <rect width="212" height="218" rx="14" fill="#0F131C" stroke="#94A3B8" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="14" y="14" width="184" height="24" rx="6" fill="#94A3B8" fill-opacity="0.16" />
    <text x="106" y="30" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">4. WEB APIs &amp; CONFIG</text>

    <text x="16" y="60" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F8FAFC">src/lib/ &amp; src/config/</text>
    <text x="16" y="82" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• svgCoords.ts (ScreenCTM)</text>
    <text x="16" y="102" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• audio.ts (Web Audio API)</text>
    <text x="16" y="122" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• urlSync.ts (Query Params)</text>
    <text x="16" y="142" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• logger.ts (Dev-only)</text>
    <text x="16" y="162" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">• simulation.ts (Hằng số)</text>

    <text x="16" y="206" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#94A3B8">Tách biệt DOM &amp; trình duyệt</text>
  </g>

  <!-- Footer Note -->
  <rect x="26" y="294" width="950" height="30" rx="8" fill="#181B25" stroke="#38BDF8" stroke-opacity="0.2" />
  <text x="500" y="313" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#CBD5E1">Luồng phụ thuộc một chiều: UI (Tầng 1) → Zustand Store (Tầng 2) → Pure Domain (Tầng 3) &amp; Native Web APIs (Tầng 4)</text>
</svg>
