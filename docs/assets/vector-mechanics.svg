<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Cơ chế Toán học và Vật lý của Nhiệm vụ Vectơ">
  <defs>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FFC640" />
    </marker>
    <marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F43F5E" />
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#56E5A9" />
    </marker>
  </defs>

  <rect width="1000" height="360" rx="16" fill="#090D16" />
  <rect x="1" y="1" width="998" height="358" rx="15" fill="none" stroke="#38BDF8" stroke-opacity="0.2" />

  <!-- Header -->
  <text x="28" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">CƠ CHẾ TOÁN HỌC &amp; VẬT LÝ — BÙ GIÓ NGANG BẰNG PHÉP CỘNG VECTƠ</text>
  <text x="972" y="34" text-anchor="end" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#38BDF8">v_R = v_A + v_W</text>

  <!-- Card 1: Giữ mũi thẳng -> Bị trôi -->
  <g transform="translate(24, 54)">
    <rect width="302" height="282" rx="14" fill="#0F131C" stroke="#F43F5E" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="16" y="28" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#F43F5E">(1) GIỮ MŨI THẲNG (000°)</text>
    <text x="16" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#CBD5E1">Không bù gió → bị gió đẩy lệch</text>

    <!-- Runway & Vectors -->
    <rect x="131" y="68" width="40" height="58" rx="3" fill="#181B25" stroke="#56E5A9" stroke-opacity="0.45" />
    <text x="151" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#94A3B8">36L</text>
    <line x1="151" y1="68" x2="151" y2="232" stroke="#56E5A9" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- v_A vertical -->
    <line x1="151" y1="226" x2="151" y2="142" stroke="#FFC640" stroke-width="2.6" marker-end="url(#m-amber)" />
    <!-- v_W leftward -->
    <line x1="151" y1="142" x2="96" y2="142" stroke="#38BDF8" stroke-width="2.6" marker-end="url(#m-cyan)" />
    <!-- v_R drifted -->
    <line x1="151" y1="226" x2="96" y2="142" stroke="#F43F5E" stroke-width="3" marker-end="url(#m-rose)" />

    <circle cx="151" cy="226" r="4" fill="#FFC640" />
    <text x="160" y="185" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#FFC640">v_A</text>
    <text x="112" y="133" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#38BDF8">v_W</text>
    <text x="72" y="192" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#F43F5E">v_R (Lệch)</text>

    <rect x="16" y="242" width="270" height="26" rx="8" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-opacity="0.45" />
    <text x="151" y="259" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#F43F5E">LỆCH TIM ĐƯỜNG BĂNG (Δθ ≠ 0)</text>
  </g>

  <!-- Card 2: Chếch mũi ngược gió -> Song song -->
  <g transform="translate(349, 54)">
    <rect width="302" height="282" rx="14" fill="#0F131C" stroke="#56E5A9" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="16" y="28" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#56E5A9">(2) CHẾCH MŨI NGƯỢC GIÓ (+θ)</text>
    <text x="16" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#CBD5E1">Thành phần ngang của v_A triệt tiêu v_W</text>

    <!-- Runway & Vectors -->
    <rect x="131" y="68" width="40" height="58" rx="3" fill="#181B25" stroke="#56E5A9" stroke-opacity="0.7" />
    <text x="151" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#56E5A9">36L</text>
    <line x1="151" y1="68" x2="151" y2="232" stroke="#56E5A9" stroke-opacity="0.35" stroke-dasharray="4 4" />

    <!-- v_A crabbed right -->
    <line x1="151" y1="226" x2="206" y2="142" stroke="#FFC640" stroke-width="2.6" marker-end="url(#m-amber)" />
    <!-- v_W leftward -->
    <line x1="206" y1="142" x2="151" y2="142" stroke="#38BDF8" stroke-width="2.6" marker-end="url(#m-cyan)" />
    <!-- v_R vertical aligned -->
    <line x1="151" y1="226" x2="151" y2="142" stroke="#56E5A9" stroke-width="3.2" marker-end="url(#m-green)" />

    <circle cx="151" cy="226" r="4" fill="#FFC640" />
    <text x="192" y="194" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#FFC640">v_A</text>
    <text x="166" y="133" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#38BDF8">v_W</text>
    <text x="92" y="186" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#56E5A9">v_R (000°)</text>

    <rect x="16" y="242" width="270" height="26" rx="8" fill="#56E5A9" fill-opacity="0.14" stroke="#56E5A9" stroke-opacity="0.5" />
    <text x="151" y="259" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#56E5A9">v_R SONG SONG ĐƯỜNG BĂNG 36L</text>
  </g>

  <!-- Card 3: Điều kiện hạ cánh an toàn -->
  <g transform="translate(674, 54)">
    <rect width="302" height="282" rx="14" fill="#0F131C" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="16" y="28" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#38BDF8">(3) ĐIỀU KIỆN HẠ CÁNH AN TOÀN</text>
    <text x="16" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#CBD5E1">Kiểm tra sai số góc trong ngưỡng ε</text>

    <!-- Tolerance Cone -->
    <polygon points="151,210 112,84 190,84" fill="#56E5A9" fill-opacity="0.12" stroke="#56E5A9" stroke-opacity="0.45" stroke-dasharray="3 3" />
    <line x1="151" y1="74" x2="151" y2="210" stroke="#56E5A9" stroke-width="2" />
    <text x="151" y="102" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#56E5A9">±ε</text>
    <circle cx="151" cy="210" r="4" fill="#56E5A9" />

    <!-- Inequality Box -->
    <rect x="16" y="146" width="270" height="44" rx="10" fill="#181B25" stroke="#38BDF8" stroke-opacity="0.35" />
    <text x="151" y="173" text-anchor="middle" font-family="'Consolas', monospace" font-size="13.5" font-weight="700" fill="#F8FAFC">|Δθ(v_R, đường băng)| ≤ ε</text>

    <!-- Configurable Tolerance Chips -->
    <rect x="20" y="202" width="76" height="26" rx="6" fill="#181B25" stroke="#94A3B8" stroke-opacity="0.4" />
    <text x="58" y="219" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#CBD5E1">±3° (Khó)</text>

    <rect x="104" y="202" width="94" height="26" rx="6" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" />
    <text x="151" y="219" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#38BDF8">±4° (Chuẩn)</text>

    <rect x="206" y="202" width="76" height="26" rx="6" fill="#181B25" stroke="#94A3B8" stroke-opacity="0.4" />
    <text x="244" y="219" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#CBD5E1">±5° (Dễ)</text>

    <rect x="16" y="242" width="270" height="26" rx="8" fill="#56E5A9" fill-opacity="0.14" stroke="#56E5A9" stroke-opacity="0.5" />
    <text x="151" y="259" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" font-weight="700" fill="#56E5A9">✓ HẠ CÁNH AN TOÀN!</text>
  </g>
</svg>
